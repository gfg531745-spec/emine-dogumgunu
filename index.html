<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emine ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        .small {
            color: #888;
            font-size: 15px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        h1 {
            font-size: clamp(45px, 10vw, 80px);
            margin-bottom: 20px;
            font-weight: 600;
        }

        p {
            color: #aaa;
            font-size: 19px;
        }

        .heart {
            margin-top: 30px;
            font-size: 35px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="small">
            SENİN İÇİN HAZIRLANDI
        </div>

        <h1>Emine ❤️</h1>

        <p>Sana küçük bir şey hazırladım...</p>

        <div class="heart">♥</div>

    </div>

</body>
</html>
